ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/html/storage>
    Require all denied
</Directory>

<FilesMatch "^(config\.php|bootstrap\.php|partials\.php|render\.yaml|Dockerfile|README\.md)$">
    Require all denied
</FilesMatch>
